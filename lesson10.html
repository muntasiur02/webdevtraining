<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>My Food Menu</title>

    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
            background-color: white ;
            padding: 20px;
            text-align: center;
        }

        h1{
            color: darkgreen;
            text-align: center;
        }

        h1+p{
            background-color: lightblue;
            padding: 15px;
            border-radius: 10px;
            color: brown;
        }

        ul{
            padding: 0;
            margin-top: 20;

        }
        
        ul>li{
            font-weight: 30;
            font-size: 20px;
            font-style: italic;
            background: aquamarine;
            padding: 10px;
            margin: 20px;
            border-radius: 10px;

        }

        ul>li:nth-child(3){
            font-size: 50px;
            background: gold;
            color:brown;
            font-weight: bold;
        }

        .desc{
            color:darkred;
            font-size: 30px;
            font-weight: bold ;
        }
        
        .desc::first-letter{
            font-size: 40px;
            font-weight:bold;
        }

        .links a{
            margin: 40px;
        }

        a:hover{
            color: darkgreen;
            background-color: white;
        }
    </style>
</head> 

<body>

    <h1>My Food Menu</h1>

    <p>Welcome to our restaurant! Enjoy our food.</p>

    <ul></ul>
</body>
