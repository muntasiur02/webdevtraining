<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>My Planet Explorer</title>
    <style>
        body{
            background-color: lightblue;
        }
        .navbar{
            background-color: darkblue;
            color: white;
        }
        .section-title{
            color:darkblue;
            margin-bottom:20px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-sm">
        <a class="navbar-brand" href="#">Planet Explorer</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Planets</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Stars</a>
            </li>
        </ul>
    </nav>

    <div class="container mt-4">
        <h2 class="section-title">Scanning</h2>
            <div class="spinner-border text-danger" role="status"></div>
            <div class="spinner-border text-warning" role="status"></div>
            <div class="spinner-border text-primary" role="status"></div>

        <h2 class="section-title mt-4">Featured Planets</h2>
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title"> Earth </h3>
                            <p class="card-text">Earth is the only planet with life.</p>
                            <button class="btn btn-success">Explore</button>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title"> Mars </h3>
                            <p class="card-text">Mars is known as the red planet</p>
                            <button class="btn btn-danger">Explore</button>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title"> Jupiter </h3>
                            <p class="card-text">Jupiter is the largest planet in the solar system.</p>
                            <button class="btn btn-warning">Explore</button>
                        </div>
                    </div>
                </div>
            </div>
        <h2 class="section-title mt-4">Browse more planets</h2>
        <ul class="pagination">
            <li class="page-items">
                <a class="page-link" href="#">Previous</a>
            </li>
            <li class="page-items">
                <a class="page-link" href="#">1</a>
            </li>
            <li class="page-items">
                <a class="page-link" href="#">2</a>
            </li>
            <li class="page-items">
                <a class="page-link" href="#">Next</a>
            </li>
        </ul>
    </div>
    
   
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
