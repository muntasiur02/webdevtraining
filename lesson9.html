<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>My Superhero Card</title>
    <style>
        body{
            background-color: darkblue;
            color:white;
            font-family: Arial, Helvetica, sans-serif;
        }
        .hero-name{
            font-size: 40px;
            font-weight: bold;
            color:yellow;
            text-shadow:3px 3px orange;
        }
        .tagline{
            font-style:italic;
            color:lightblue;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color:coral;
        }
        .power{
            font-weight: bold;
            color:green;
        }
        .weakness{
            text-decoration: line-through;
        }
        .badge{
            font-weight: bold;
            font-size: 28 px;
            color: gold;
            transform: rotate(30deg);
        }
        
    </style>
</head>
<body>
    <h1 class="'hero-name">Superman</h1>
    <p class="tagline"> Protector of the universe</p>
    <h2 class="'label"> Super Powers:</h2>
    <p class="power"> Superstrength </p>
    <p class="power"> Invisibilty </p>
    <h3 class="label">Weaknesses:</h3>
    <p class="weakness">Dark Magic</p>
    <p class="weakness">Kryptonite</p>

    <p class="badge">SUPERHERO</p>
    <footer>
    <p> Created by: Muntasiur Rahman</p>
    </footer>



</body>
</html>
