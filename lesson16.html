<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>My Science Lab</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: Arial, Helvetica, sans-serif ;
        }
        .jumbotron{
            background-color: lightyellow;
            border: 2px solid black;
        }
        .jumbotron h1{
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size:50px;
        }
        .section-title{
            color: darkred;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        p {
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>Welcome to my science lab.</h1>
            <p class="lead">Lets explore the fascinating world of science.</p>
        </div>
    </div>
    <div class="container">
        <p>Choose ur sebjects</p>
        <button class="btn btn-primary">Chemistry</button>
        <button class="btn btn-success">Biology</button>
        <button class="btn btn-warning">Physics</button>
        <button class="btn btn-danger">Astronomy</button>
    </div>
    
    <div class="container">
    <h2 class="section-title">Experiments Completed <span class="badge badge-primary"> 10 completed</span></h2>
    <p>Chemistry <span class="badge badge-primary"> 2 completed </span></p>
    <p>Biology <span class="badge badge-success"> 2 completed </span></p>
    <p>Physics <span class="badge badge-warning"> 3 completed </span></p>
    <p>Astronomy <span class="badge badge-danger"> 3 completed </span></p>
    </div> 

    <div class="container">
        <h2 class="section-title">Research Progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width:70%"> 70%</div>
        </div>
        <p>Biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width:80%"> 80%</div>
        </div>
        <p>Physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width:95%"> 95%</div>
        </div>
        <p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width:90%"> 90%</div>
        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
