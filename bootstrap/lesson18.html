<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>My Animal Safari</title>
    <style>
        body{
            position:relative;
        }
        .safari-slide{
            color: white;
            text-align: center;
            padding:50px 20px;
        }
        .forest-slide{
            background-color: forestgreen;
        }
        .ocean-slide{
            background-color: steelblue;
        }
        .desert-slide{
            background-color: rgb(210, 105, 12);
        }
        .section{
            padding: 40px 40px;
            background-color: whitesmoke;
        }
        #forest{
            background-color: lightgreen;
        }
        #ocean{
            background-color: lightblue;
        }
        #desert{
            background-color: sandybrown;
        }
    </style>
</head>

<body  data-spy="scroll" data-target="#SafariNav" data-offset="60">
    <div id="safaricarousel" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
            <ol class="carousel-indicators">
                <li data-target="#safariCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#safariCarousel" data-slide-to="1" ></li>
                <li data-target="#safariCarousel" data-slide-to="2" ></li>
            </ol>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item safari-slide slide-forest">Forest Safari</div>
            <div class="carousel-item safari-slide slide-forest">Ocean Safari</div>
            <div class="carousel-item safari-slide slide-forest">Desert Safari</div>
        </div>

        <a class="carousel-control-prev" href="#safariCarousel" data-slide="prev">
            <span class="carousel-control-prev"></span>
        </a>

        <a class="carousel-control-next" href="#safariCarousel" data-slide="next">
            <span class="carousel-control-next"></span>
        </a>
    </div>

    <nav id="SafariNav" class="navbar navbar-expand-sm sticky-top">
        <span class="navbar-brand">Safari Guide</span>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="#forest"> Forest</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#ocean"> Ocean</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#desert"> Desert</a>
            </li>
        </ul>
    </nav>
    
    
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
