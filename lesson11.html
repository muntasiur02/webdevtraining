<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>My Animal Fact File</title>

    <style>

        body{
            background-color: darkgreen;
            font-family: Arial, Helvetica, sans-serif;
        }

        .fact-file{
            background-color: lightyellow;
            color:black;
            width:400px;
            padding:20px;
            border:3px solid black;
            margin:20px auto;
        }

        .animal-name{
            color:forestgreen;
            font-size:30px
        }

        .detail{
            color: darkslategray;
        }

        .cool-fact{
            color:orange;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="fact-file">
        <h1 class="animal-name">Tiger</h1>

        <p class="detail">Type:Mammal</p>
        <p class="detail">Habitat:Forsts and Grasslands</p>
        <p class="detail">Diet:Meat</p>
        <p class="cool-fact">Cool fact: The colour of tigers can vary according to their climates</p>
    </div>
</body>
</html>
